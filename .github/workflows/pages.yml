name: Refresh rankings and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: overwatch-ranker-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ref-guard:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "This workflow only operates on refs/heads/main" && exit 1

  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch generated-data cache
        shell: bash
        run: |
          git fetch origin generated-data:refs/remotes/origin/generated-data || true
          rm -rf .cache/generated-data
          mkdir -p .cache/generated-data
          if git show origin/generated-data:classement.json > .cache/generated-data/classement.json 2>/dev/null && git show origin/generated-data:data-meta.json > .cache/generated-data/data-meta.json 2>/dev/null; then
            echo "Generated cache fetched; validator will decide whether it is usable."
          else
            rm -f .cache/generated-data/classement.json .cache/generated-data/data-meta.json
            echo "No generated-data cache found."
          fi
      - name: Run complete update or stale-safe fallback
        env:
          ALLOW_HERO_ASSETS: ${{ vars.ALLOW_HERO_ASSETS }}
        run: |
          mkdir -p .work docs
          args=(--work-dir .work --cache-dir .cache/generated-data --site-dir docs --repo-root . --run-id "$GITHUB_RUN_ID")
          if [ "$ALLOW_HERO_ASSETS" = true ]; then args+=(--allow-hero-assets); fi
          python scripts/update_dataset.py "${args[@]}"
      - name: Validate generated pair before cache replacement
        run: |
          python scripts/validate_json.py .work/classement.json
          python -c 'from scripts.prepare_site import validate_metadata; validate_metadata(".work/data-meta.json")'
      - name: Persist only validated generated pair
        shell: bash
        run: |
          rm -rf .generated-data .generated-branch
          mkdir .generated-data
          cp .work/classement.json .generated-data/classement.json
          cp .work/data-meta.json .generated-data/data-meta.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/generated-data; then
            git worktree add --detach .generated-branch origin/generated-data
            cp .generated-data/* .generated-branch/
            git -C .generated-branch add -- classement.json data-meta.json
            git -C .generated-branch diff --cached --quiet || git -C .generated-branch commit -m "Refresh generated ranking data"
          else
            git worktree add --detach .generated-branch HEAD
            git -C .generated-branch switch --orphan generated-data
            git -C .generated-branch clean -fdx
            cp .generated-data/* .generated-branch/
            git -C .generated-branch add -- classement.json data-meta.json
            git -C .generated-branch commit -m "Initialize generated ranking cache"
          fi
          git -C .generated-branch push origin HEAD:generated-data

  pages:
    if: github.ref == 'refs/heads/main' && vars.PAGES_PUBLISH_ENABLED == 'true'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Materialize and validate generated site data
        env:
          ALLOW_HERO_ASSETS: ${{ vars.ALLOW_HERO_ASSETS }}
        shell: bash
        run: |
          git fetch origin generated-data
          mkdir -p .artifact-data
          git show origin/generated-data:classement.json > .artifact-data/classement.json
          git show origin/generated-data:data-meta.json > .artifact-data/data-meta.json
          args=(--dataset .artifact-data/classement.json --metadata .artifact-data/data-meta.json --output docs --repo-root .)
          if [ "$ALLOW_HERO_ASSETS" = true ]; then args+=(--allow-hero-assets); fi
          python scripts/prepare_site.py "${args[@]}"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
